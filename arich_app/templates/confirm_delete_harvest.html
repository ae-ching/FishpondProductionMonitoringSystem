{% load static %}

<style>
  .space-y-6 > * + * {
    margin-top: 1.5rem;
  }
  .border {
    border: 1px solid #e5e7eb;
  }
  .rounded {
    border-radius: 0.375rem;
  }
  .bg-white {
    background-color: #ffffff;
  }
  .shadow-sm {
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  }
  .p-6 {
    padding: 1.5rem;
  }
  .text-2xl {
    font-size: 1.5rem;
    line-height: 2rem;
  }
  .font-bold {
    font-weight: 700;
  }
  .text-red-600 {
    color: #dc2626;
  }
  .mb-4 {
    margin-bottom: 1rem;
  }
  .text-gray-700 {
    color: #374151;
  }
  .mb-6 {
    margin-bottom: 1.5rem;
  }
  .bg-red-50 {
    background-color: #fef2f2;
  }
  .border-red-200 {
    border-color: #fecaca;
  }
  .p-4 {
    padding: 1rem;
  }
  .text-sm {
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
  .text-red-800 {
    color: #991b1b;
  }
  .flex {
    display: flex;
  }
  .gap-3 {
    gap: 0.75rem;
  }
  .px-4 {
    padding-left: 1rem;
    padding-right: 1rem;
  }
  .py-2 {
    padding-top: 0.5rem;
    padding-bottom: 0.5rem;
  }
  .bg-red-600 {
    background-color: #dc2626;
  }
  .text-white {
    color: #ffffff;
  }
  .hover\:bg-red-700:hover {
    background-color: #b91c1c;
  }
  .font-semibold {
    font-weight: 600;
  }
  .border-gray-300 {
    border-color: #d1d5db;
  }
  .hover\:bg-gray-50:hover {
    background-color: #f9fafb;
  }
</style>

<div class="space-y-6">
  <div class="border rounded bg-white shadow-sm p-6">
    <h2 class="text-2xl font-bold text-red-600 mb-4">Delete Harvest Record</h2>

    <p class="text-gray-700 mb-6">
      Are you sure you want to delete the harvest record for <strong>"{{ harvest.fish_type.name }}"</strong> on <strong>{{ harvest.date }}</strong>?
    </p>

    <div class="bg-red-50 border border-red-200 rounded p-4 mb-6">
      <p class="text-sm text-red-800">
        ⚠️ <strong>Warning:</strong> This action cannot be undone.
      </p>
    </div>

    <form method="POST" action="{% url 'delete_harvest' harvest.pk %}" class="flex gap-3">
      {% csrf_token %}

      <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 font-semibold">
        🗑️ Yes, Delete Harvest Record
      </button>

      {% if modal %}
      <button type="button" onclick="closeDeleteHarvestModal()" class="px-4 py-2 border border-gray-300 text-gray-700 rounded hover:bg-gray-50 font-semibold">
        Cancel
      </button>
      {% else %}
      <a href="{% url 'harvest' %}" class="px-4 py-2 border border-gray-300 text-gray-700 rounded hover:bg-gray-50 font-semibold">
        Cancel
      </a>
      {% endif %}
    </form>
  </div>
</div>
